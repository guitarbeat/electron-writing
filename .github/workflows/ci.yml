name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint (Type Check)
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Push Database Schema
        run: pnpm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Run Focused Logic Tests
        run: npx tsx scratch/logic_test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PASSCODE: 0000
          SESSION_SECRET: test_secret

    # Note: If tests require a real DB, you'd add a postgres service container here.
    # For now, we assume logic_test.ts can run or fail gracefully if the DB is missing.
